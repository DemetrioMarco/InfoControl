@if (isOpen()) {
  <div class="modal fade show d-block" tabindex="-1" style="background: rgba(0,0,0,.45);">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">

        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-semibold">{{ title() }}</h5>
          <button type="button" class="btn-close" (click)="cancelled.emit()"></button>
        </div>

        <div class="modal-body text-muted">
          <p class="mb-1">{{ message() }}</p>
          <p class="mb-0 text-danger">{{ subMessage() }}</p>
        </div>

        <div class="modal-footer border-0 pt-0">
          <button class="btn btn-secondary btn-sm" (click)="cancelled.emit()">Cancelar</button>
          <button class="btn btn-sm" [ngClass]="confirmClass()" (click)="confirmed.emit()">
            {{ confirmLabel() }}
          </button>
        </div>

      </div>
    </div>
  </div>
}
