<div class="card shadow-sm border-0">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
    <div>
      <h5 class="mb-0 text-primary fw-bold">Ubicaciones Físicas</h5>
      <small class="text-muted">Control de espacios de almacenamiento</small>
    </div>
    <button class="btn btn-primary shadow-sm" (click)="openModal()">
      <i class="bi bi-geo-alt-fill"></i> Nueva Ubicación
    </button>
  </div>
  
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light text-uppercase small">
          <tr>
            <th class="ps-4">Ubicación</th>
            <th>Tipo de Espacio</th>
            <th>Descripción</th>
            <th class="text-center">Estado</th>
            <th class="text-end pe-4">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (ubi of ubicaciones(); track ubi.id) {
            <tr>
              <td class="ps-4 fw-bold text-dark">
                <i class="bi bi-box-seam text-secondary me-2"></i>{{ ubi.nombre }}
              </td>
              <td>
                <span class="badge rounded-pill bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-3">
                  {{ ubi.tipoUbicacionNombre }}
                </span>
              </td>
              <td class="text-muted small">{{ ubi.descripcion || '---' }}</td>
              <td class="text-center">
                <div class="form-check form-switch d-inline-block">
                  <input class="form-check-input" type="checkbox" 
                         [checked]="ubi.activo" 
                         (change)="toggleStatus(ubi)">
                </div>
              </td>
              <td class="text-end pe-4">
                <div class="btn-group">
                  <button class="btn btn-sm btn-outline-secondary" (click)="openModal(ubi)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteUbicacion(ubi.id)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="text-center py-5 text-muted">
                <i class="bi bi-geo-fill fs-2 d-block mb-2 opacity-25"></i>
                No hay ubicaciones configuradas.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
