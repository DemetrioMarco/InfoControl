<div class="card shadow-sm border-0">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
    <div>
      <h5 class="mb-0 text-primary fw-bold">Unidades de Medida</h5>
      <small class="text-muted">Unidades de conteo y pesaje para inventario</small>
    </div>
    <button class="btn btn-primary shadow-sm" (click)="openModal()">
      <i class="bi bi-plus-lg"></i> Nueva Unidad
    </button>
  </div>
  
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-4" style="width: 150px;">Código</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th class="text-center">Estado</th>
            <th class="text-end pe-4">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (unit of unidades; track unit.id) {
            <tr>
              <td class="ps-4">
                <span class="badge bg-info-subtle text-info border border-info-subtle fw-bold">
                  {{ unit.codigo }}
                </span>
              </td>
              <td class="fw-semibold text-dark">{{ unit.nombre }}</td>
              <td class="text-muted small">{{ unit.descripcion || '---' }}</td>
              <td class="text-center">
                <div class="form-check form-switch d-inline-block">
                  <input class="form-check-input" type="checkbox" 
                         [checked]="unit.activo" 
                         (change)="toggleStatus(unit)">
                </div>
              </td>
              <td class="text-end pe-4">
                <div class="btn-group">
                  <button class="btn btn-sm btn-outline-secondary" (click)="openModal(unit)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteUnidad(unit.id)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="text-center py-5 text-muted">No hay unidades de medida registradas.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
