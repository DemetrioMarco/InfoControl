<div class="card shadow-sm border-0">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
    <div>
      <h5 class="mb-0 text-primary fw-bold">Unidades de Medida</h5>
      <small class="text-muted">Control de magnitudes para inventario</small>
    </div>
    <button class="btn btn-primary shadow-sm" (click)="openModal()">
      <i class="bi bi-rulers"></i> Nueva Unidad
    </button>
  </div>
  
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light text-uppercase small">
          <tr>
            <th class="ps-4">Código</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th class="text-center">Estado</th>
            <th class="text-end pe-4">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (unid of unidades(); track unid.id) {
            <tr>
              <td class="ps-4">
                <span class="badge bg-light text-primary border border-primary border-opacity-25 px-3">
                  {{ unid.codigo }}
                </span>
              </td>
              <td class="fw-bold text-dark">{{ unid.nombre }}</td>
              <td class="text-muted small">{{ unid.descripcion || '---' }}</td>
              <td class="text-center">
                <div class="form-check form-switch d-inline-block">
                  <input class="form-check-input" type="checkbox" 
                         [checked]="unid.activo" 
                         (change)="toggleStatus(unid)">
                </div>
              </td>
              <td class="text-end pe-4">
                <div class="btn-group">
                  <button class="btn btn-sm btn-outline-secondary" (click)="openModal(unid)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteUnidad(unid.id)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="text-center py-5 text-muted">
                <i class="bi bi-info-circle fs-2 d-block mb-2 opacity-25"></i>
                No hay unidades registradas.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
