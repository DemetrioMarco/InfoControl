<div class="card shadow-sm border-0">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
    <div>
      <h5 class="mb-0 text-primary fw-bold">Tipos de Ubicación</h5>
      <small class="text-muted">Categorización de espacios físicos</small>
    </div>
    <button class="btn btn-primary shadow-sm" (click)="openModal()">
      <i class="bi bi-plus-lg"></i> Nuevo Tipo
    </button>
  </div>
  
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light text-uppercase small">
          <tr>
            <th class="ps-4">Código</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th class="text-center">Estado</th>
            <th class="text-end pe-4">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (tipo of tiposUbicacion(); track tipo.id) {
            <tr>
              <td class="ps-4">
                <span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary border-opacity-25 px-3">
                  {{ tipo.codigo }}
                </span>
              </td>
              <td>
                <span class="fw-bold text-dark">{{ tipo.nombre }}</span>
              </td>
              <td class="text-muted small">
                {{ tipo.descripcion || '---' }}
              </td>
              <td class="text-center">
                <div class="form-check form-switch d-inline-block">
                  <input class="form-check-input" type="checkbox" 
                         [checked]="tipo.activo" 
                         (change)="toggleStatus(tipo)">
                </div>
              </td>
              <td class="text-end pe-4">
                <div class="btn-group">
                  <button class="btn btn-sm btn-outline-secondary" (click)="openModal(tipo)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteTipo(tipo.id)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="text-center py-5 text-muted">
                <i class="bi bi-layers fs-1 d-block mb-3 opacity-25"></i>
                No se encontraron tipos de ubicación.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
