<div class="card shadow-sm border-0">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
    <div>
      <h5 class="mb-0 text-primary fw-bold">Sub-ubicaciones</h5>
      <small class="text-muted">Desglose detallado de ubicaciones principales</small>
    </div>
    <button class="btn btn-primary shadow-sm" (click)="openModal()">
      <i class="bi bi-plus-lg"></i> Nueva SubUbicación
    </button>
  </div>
  
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light text-uppercase small">
          <tr>
            <th class="ps-4">Ubicación Principal</th>
            <th>Sub-ubicación</th>
            <th>Descripción</th>
            <th class="text-center">Estado</th>
            <th class="text-end pe-4">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Uso de Signal: subUbicaciones() -->
          @for (sub of subUbicaciones(); track sub.id) {
            <tr>
              <td class="ps-4">
                <span class="badge bg-light text-dark border fw-semibold">
                  {{ sub.ubicacionNombre }}
                </span>
              </td>
              <td class="fw-bold text-dark">{{ sub.nombre }}</td>
              <td class="text-muted small">{{ sub.descripcion || '---' }}</td>
              <td class="text-center">
                <div class="form-check form-switch d-inline-block">
                  <input class="form-check-input" type="checkbox" 
                         [checked]="sub.activo" 
                         (change)="toggleStatus(sub)">
                </div>
              </td>
              <td class="text-end pe-4">
                <div class="btn-group">
                  <button class="btn btn-sm btn-outline-secondary" (click)="openModal(sub)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteSubUbicacion(sub.id)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="5" class="text-center py-5 text-muted">
                <i class="bi bi-geo-alt-fill fs-2 d-block mb-2"></i>
                No hay sub-ubicaciones registradas.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
