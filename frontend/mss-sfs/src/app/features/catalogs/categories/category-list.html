<div class="card shadow-sm border-0">
  <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
    <div>
      <h5 class="mb-0 text-primary fw-bold">Categorías de Productos</h5>
      <small class="text-muted">Gestión de grupos principales de inventario</small>
    </div>
    <button class="btn btn-primary shadow-sm" (click)="openModal()">
      <i class="bi bi-plus-lg"></i> Nueva Categoría
    </button>
  </div>
  
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-4">Nombre</th>
            <th>Descripción</th>
            <th class="text-center">Estado</th>
            <th class="text-end pe-4">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (cat of categorias(); track cat.id) {
            <tr>
              <td class="ps-4 fw-bold text-dark">{{ cat.nombre }}</td>
              <td class="text-muted small">{{ cat.descripcion || 'Sin descripción' }}</td>
              <td class="text-center">
                <div class="form-check form-switch d-inline-block">
                  <input class="form-check-input" type="checkbox" 
                         [checked]="cat.activo" 
                         (change)="toggleStatus(cat)">
                </div>
              </td>
              <td class="text-end pe-4">
                <div class="btn-group">
                  <button class="btn btn-sm btn-outline-secondary" (click)="openModal(cat)">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteCategoria(cat.id)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center py-5 text-muted">
                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                No se encontraron categorías.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
